x-database-budget: &database-budget
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_POOL_OVERFLOW: ${DATABASE_POOL_OVERFLOW:-0}
  DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-5}
  DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5}
  DATABASE_API_STATEMENT_MS: ${DATABASE_API_STATEMENT_MS:-30000}
  DATABASE_WORKER_STATEMENT_MS: ${DATABASE_WORKER_STATEMENT_MS:-120000}
  DATABASE_LOCK_MS: ${DATABASE_LOCK_MS:-5000}

x-worker-database-budget: &worker-database-budget
  <<: *database-budget
  DATABASE_POOL_SIZE: ${WORKER_DATABASE_POOL_SIZE:-1}
  DATABASE_POOL_OVERFLOW: ${WORKER_DATABASE_POOL_OVERFLOW:-0}

x-runtime-settings: &runtime-settings
  APP_ENV: ${APP_ENV:-development}
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
  LOG_MAX_FILE_BYTES: ${LOG_MAX_FILE_BYTES:-67108864}
  LOG_QUEUE_BYTES: ${LOG_QUEUE_BYTES:-8388608}
  LOG_SHUTDOWN_SECONDS: ${LOG_SHUTDOWN_SECONDS:-2}
  DOCUMENT_CPU_SECONDS: ${DOCUMENT_CPU_SECONDS:-120}
  DOCUMENT_MEMORY_BYTES: ${DOCUMENT_MEMORY_BYTES:-1073741824}
  EMBEDDING_WORKER_TIMEOUT: ${EMBEDDING_WORKER_TIMEOUT:-10}
  EMBEDDING_INITIALIZATION_TIMEOUT: ${EMBEDDING_INITIALIZATION_TIMEOUT:-45}
  RAG_INFERENCE_WAIT_SECONDS: ${RAG_INFERENCE_WAIT_SECONDS:-2}
  AUTH_GLOBAL_CAPACITY: ${AUTH_GLOBAL_CAPACITY:-16}
  AUTH_OWNER_CAPACITY: ${AUTH_OWNER_CAPACITY:-8}
  AUTH_ACCOUNT_MINUTE_LIMIT: ${AUTH_ACCOUNT_MINUTE_LIMIT:-20}
  AUTH_CLIENT_MINUTE_LIMIT: ${AUTH_CLIENT_MINUTE_LIMIT:-60}
  WORK_GLOBAL_CAPACITY: ${WORK_GLOBAL_CAPACITY:-16}
  WORK_OWNER_CAPACITY: ${WORK_OWNER_CAPACITY:-2}
  PARSE_GLOBAL_CAPACITY: ${PARSE_GLOBAL_CAPACITY:-4}
  PARSE_OWNER_CAPACITY: ${PARSE_OWNER_CAPACITY:-1}

x-files-settings: &file-settings
  CLOUDINARY_URL: ${CLOUDINARY_URL:?Set server-only CLOUDINARY_URL for private file storage}
  FILES_NAMESPACE: mentra
  FILES_CONCURRENCY: ${FILES_CONCURRENCY:-8}
  FILES_TIMEOUT_SECONDS: ${FILES_TIMEOUT_SECONDS:-60}

x-retrieval-settings: &retrieval-settings
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
  EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
  QDRANT_URL: ${QDRANT_URL:-}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-}
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-}
  QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
  RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-26214400}
  RAG_STORAGE_QUOTA_BYTES: ${RAG_STORAGE_QUOTA_BYTES:-536870912}
  RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-true}
  RAG_RERANKER_PATH: ${RAG_RERANKER_PATH:-}
  RAG_RERANKER_TIMEOUT: ${RAG_RERANKER_TIMEOUT:-5}
  RAG_MAX_PAGES: ${RAG_MAX_PAGES:-200}
  RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS:-5000}
  RAG_PARSER_TIMEOUT: ${RAG_PARSER_TIMEOUT:-120}
  RAG_JOB_LEASE_SECONDS: ${RAG_JOB_LEASE_SECONDS:-300}
  OMP_NUM_THREADS: ${RAG_INFERENCE_THREADS:-2}
  MKL_NUM_THREADS: ${RAG_INFERENCE_THREADS:-2}

x-model-settings: &model-settings
  AI_PROVIDER: ${AI_PROVIDER:-openai_compatible}
  AI_MODEL: ${AI_MODEL:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_TEMPERATURE: ${AI_TEMPERATURE:-0.2}
  AI_TIMEOUT: ${AI_TIMEOUT:-30}
  AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
  AI_VISION_MODEL: ${AI_VISION_MODEL:-}
  ASSESSMENT_VISION_ENABLED: ${ASSESSMENT_VISION_ENABLED:-true}
  ASSESSMENT_GENERATION_OUTPUT_TOKENS: ${ASSESSMENT_GENERATION_OUTPUT_TOKENS:-8192}
  ASSESSMENT_GRADING_OUTPUT_TOKENS: ${ASSESSMENT_GRADING_OUTPUT_TOKENS:-8192}
  CHAT_INPUT_TOKENS: ${CHAT_INPUT_TOKENS:-8192}
  CHAT_RECOVERY_INPUT_TOKENS: ${CHAT_RECOVERY_INPUT_TOKENS:-12288}
  CHAT_CONTEXT_WINDOW_TOKENS: ${CHAT_CONTEXT_WINDOW_TOKENS:-16384}
  CHAT_OUTPUT_TOKEN_RESERVE: ${CHAT_OUTPUT_TOKEN_RESERVE:-2048}
  CHAT_SUMMARY_MAX_TOKENS: ${CHAT_SUMMARY_MAX_TOKENS:-600}
  CHAT_SUMMARY_MAX_CHARACTERS: ${CHAT_SUMMARY_MAX_CHARACTERS:-2400}
  MEMORY_SUMMARY_ENABLED: ${MEMORY_SUMMARY_ENABLED:-true}
  MEMORY_SUMMARY_MAX_TOKENS: ${MEMORY_SUMMARY_MAX_TOKENS:-800}
  MEMORY_SUMMARY_MAX_CHARACTERS: ${MEMORY_SUMMARY_MAX_CHARACTERS:-3200}
  MEMORY_SUMMARY_INPUT_TOKENS: ${MEMORY_SUMMARY_INPUT_TOKENS:-6000}
  CHAT_SUMMARY_ENABLED: ${CHAT_SUMMARY_ENABLED:-true}
  SUMMARIZER_CONCURRENCY: ${SUMMARIZER_CONCURRENCY:-2}

services:
  postgres:
    image: postgres:17
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mentra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentra_local}
      POSTGRES_DB: ${POSTGRES_DB:-mentra}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mentra_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: mentra-backend
    build:
      context: ./backend
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
        RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-}
        SPEECH_MODEL: ${SPEECH_MODEL:-base}
    container_name: mentra-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      <<: [*database-budget, *runtime-settings, *model-settings, *file-settings]
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-true}
      LOG_DIRECTORY: /var/log/mentra
      LOG_PARAMETER_DETAILS: ${LOG_PARAMETER_DETAILS:-true}
      LOG_WORKFLOW_SUMMARIES: ${LOG_WORKFLOW_SUMMARIES:-true}
      LOG_SUMMARY_MAX_STEPS: ${LOG_SUMMARY_MAX_STEPS:-500}
      LOG_EVENT_MAX_BYTES: ${LOG_EVENT_MAX_BYTES:-32768}
      LOG_HEALTH_REQUESTS: ${LOG_HEALTH_REQUESTS:-false}
      LOG_POLL_REQUESTS: ${LOG_POLL_REQUESTS:-false}
      APP_ENV: ${APP_ENV:-development}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Pass through the complete caller-provided URL. Local PostgreSQL credentials
      # above configure only the optional postgres service; they are never merged
      # into DATABASE_URL.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a complete PostgreSQL connection URL}
      AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-3600}
      AUTH_PERSISTENT_SESSION_SECONDS: ${AUTH_PERSISTENT_SESSION_SECONDS:-2592000}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-lax}
      AUTH_EXTERNAL_PROVIDERS: '${AUTH_EXTERNAL_PROVIDERS:-{}}'
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
      WEB_SEARCH_TIMEZONE: ${WEB_SEARCH_TIMEZONE:-UTC}
      WEB_SEARCH_DAILY_LIMIT: ${WEB_SEARCH_DAILY_LIMIT:-90}
      WEB_SEARCH_USER_DAILY_LIMIT: ${WEB_SEARCH_USER_DAILY_LIMIT:-10}
      WEB_SEARCH_USER_MINUTE_LIMIT: ${WEB_SEARCH_USER_MINUTE_LIMIT:-3}
      WEB_SEARCH_CACHE_SECONDS: ${WEB_SEARCH_CACHE_SECONDS:-120}
      YOU_WEB_SEARCH_API_KEY: ${YOU_WEB_SEARCH_API_KEY:-}
      WEB_RESEARCH_DAILY_LIMIT: ${WEB_RESEARCH_DAILY_LIMIT:-20}
      WEB_RESEARCH_USER_DAILY_LIMIT: ${WEB_RESEARCH_USER_DAILY_LIMIT:-5}
      CHAT_HISTORY_TOKEN_BUDGET: ${CHAT_HISTORY_TOKEN_BUDGET:-1800}
      CHAT_INPUT_TOKENS: ${CHAT_INPUT_TOKENS:-8192}
      CHAT_RECOVERY_INPUT_TOKENS: ${CHAT_RECOVERY_INPUT_TOKENS:-12288}
      CHAT_SUMMARY_ENABLED: ${CHAT_SUMMARY_ENABLED:-true}
      CHAT_CONTEXT_WINDOW_TOKENS: ${CHAT_CONTEXT_WINDOW_TOKENS:-16384}
      CHAT_OUTPUT_TOKEN_RESERVE: ${CHAT_OUTPUT_TOKEN_RESERVE:-2048}
      MEMORY_ACTIVE_LIMIT: ${MEMORY_ACTIVE_LIMIT:-200}
      MEMORY_PENDING_LIMIT: ${MEMORY_PENDING_LIMIT:-50}
      MEMORY_GOAL_DAYS: ${MEMORY_GOAL_DAYS:-30}
      MEMORY_FACT_DAYS: ${MEMORY_FACT_DAYS:-180}
      MEMORY_PREFERENCE_DAYS: ${MEMORY_PREFERENCE_DAYS:-365}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-26214400}
      RAG_STORAGE_QUOTA_BYTES: ${RAG_STORAGE_QUOTA_BYTES:-536870912}
      RAG_HYBRID_ENABLED: ${RAG_HYBRID_ENABLED:-true}
      RAG_RERANKER_PATH: ${RAG_RERANKER_PATH:-}
      RAG_RERANKER_TIMEOUT: ${RAG_RERANKER_TIMEOUT:-5}
      SPEECH_CPU_THREADS: ${SPEECH_CPU_THREADS:-2}
      SPEECH_BEAM_SIZE: ${SPEECH_BEAM_SIZE:-3}
      SPEECH_TIMEOUT_SECONDS: ${SPEECH_TIMEOUT_SECONDS:-20}
      SPEECH_WARM_ON_STARTUP: ${SPEECH_WARM_ON_STARTUP:-true}
      RAG_MAX_PAGES: ${RAG_MAX_PAGES:-200}
      RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS:-5000}
      RAG_PARSER_TIMEOUT: ${RAG_PARSER_TIMEOUT:-120}
      RAG_JOB_LEASE_SECONDS: ${RAG_JOB_LEASE_SECONDS:-300}
      OMP_NUM_THREADS: ${RAG_INFERENCE_THREADS:-2}
      MKL_NUM_THREADS: ${RAG_INFERENCE_THREADS:-2}
    volumes:
      - ./logs/backend:/var/log/mentra
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${BACKEND_PORT:-8000}/api/v1/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  rag-worker:
    image: mentra-backend
    restart: unless-stopped
    command: ["python", "-m", "app.rag.worker"]
    stop_grace_period: 150s
    environment:
      <<: [*worker-database-budget, *runtime-settings, *file-settings]
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-true}
      LOG_DIRECTORY: /var/log/mentra
      LOG_PARAMETER_DETAILS: ${LOG_PARAMETER_DETAILS:-true}
      LOG_WORKFLOW_SUMMARIES: ${LOG_WORKFLOW_SUMMARIES:-true}
      LOG_SUMMARY_MAX_STEPS: ${LOG_SUMMARY_MAX_STEPS:-500}
      LOG_EVENT_MAX_BYTES: ${LOG_EVENT_MAX_BYTES:-32768}
      LOG_HEALTH_REQUESTS: ${LOG_HEALTH_REQUESTS:-false}
      LOG_POLL_REQUESTS: ${LOG_POLL_REQUESTS:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a complete PostgreSQL connection URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      RAG_MAX_UPLOAD_BYTES: ${RAG_MAX_UPLOAD_BYTES:-26214400}
      RAG_STORAGE_QUOTA_BYTES: ${RAG_STORAGE_QUOTA_BYTES:-536870912}
      RAG_MAX_PAGES: ${RAG_MAX_PAGES:-200}
      RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS:-5000}
      RAG_PARSER_TIMEOUT: ${RAG_PARSER_TIMEOUT:-120}
      RAG_JOB_LEASE_SECONDS: ${RAG_JOB_LEASE_SECONDS:-300}
      OMP_NUM_THREADS: ${RAG_INFERENCE_THREADS:-2}
      MKL_NUM_THREADS: ${RAG_INFERENCE_THREADS:-2}
    volumes:
      - ./logs/backend:/var/log/mentra
    depends_on:
      backend:
        condition: service_healthy

  events-worker:
    image: mentra-backend
    restart: unless-stopped
    command: ["python", "-m", "app.history_management.events.worker"]
    environment:
      <<: [*worker-database-budget, *runtime-settings]
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-true}
      LOG_DIRECTORY: /var/log/mentra
      LOG_PARAMETER_DETAILS: ${LOG_PARAMETER_DETAILS:-true}
      LOG_WORKFLOW_SUMMARIES: ${LOG_WORKFLOW_SUMMARIES:-true}
      LOG_SUMMARY_MAX_STEPS: ${LOG_SUMMARY_MAX_STEPS:-500}
      LOG_EVENT_MAX_BYTES: ${LOG_EVENT_MAX_BYTES:-32768}
      LOG_HEALTH_REQUESTS: ${LOG_HEALTH_REQUESTS:-false}
      LOG_POLL_REQUESTS: ${LOG_POLL_REQUESTS:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a complete PostgreSQL connection URL}
    volumes:
      - ./logs/backend:/var/log/mentra
    depends_on:
      backend:
        condition: service_healthy

  assessment-worker:
    image: mentra-backend
    restart: unless-stopped
    command: ["python", "-m", "app.assessments.worker"]
    stop_grace_period: 100s
    environment:
      <<: [*worker-database-budget, *runtime-settings, *model-settings, *retrieval-settings, *file-settings]
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      LOG_FILE_ENABLED: ${LOG_FILE_ENABLED:-true}
      LOG_DIRECTORY: /var/log/mentra
      LOG_PARAMETER_DETAILS: ${LOG_PARAMETER_DETAILS:-true}
      LOG_WORKFLOW_SUMMARIES: ${LOG_WORKFLOW_SUMMARIES:-true}
      LOG_SUMMARY_MAX_STEPS: ${LOG_SUMMARY_MAX_STEPS:-500}
      LOG_EVENT_MAX_BYTES: ${LOG_EVENT_MAX_BYTES:-32768}
      LOG_HEALTH_REQUESTS: ${LOG_HEALTH_REQUESTS:-false}
      LOG_POLL_REQUESTS: ${LOG_POLL_REQUESTS:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a complete PostgreSQL connection URL}
    volumes:
      - ./logs/backend:/var/log/mentra
    depends_on:
      backend:
        condition: service_healthy

  summarizer:
    image: mentra-backend
    restart: unless-stopped
    command: ["python", "-m", "app.summarization.worker"]
    stop_grace_period: 60s
    environment:
      <<: [*worker-database-budget, *runtime-settings, *model-settings]
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a complete PostgreSQL connection URL}
      LOG_DIRECTORY: /var/log/mentra
    volumes:
      - ./logs/backend:/var/log/mentra
    depends_on:
      backend:
        condition: service_healthy

  files-worker:
    image: mentra-backend
    restart: unless-stopped
    command: ["python", "-m", "app.files.worker"]
    environment:
      <<: [*worker-database-budget, *runtime-settings, *file-settings]
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to a complete PostgreSQL connection URL}
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: mentra-frontend
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mentra_postgres:
