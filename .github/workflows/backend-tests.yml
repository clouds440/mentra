name: Backend regression tests

on:
  pull_request:
    paths: ['backend/**', 'docker-compose.yml', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['backend/**', 'docker-compose.yml', '.github/workflows/**']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-test-password
          POSTGRES_DB: mentra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://postgres:disposable-test-password@127.0.0.1:5432/mentra_test
      DATABASE_URL: ''
      LOG_LEVEL: ERROR
      LOG_FILE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install offline parser prerequisites
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils
      - name: Install production-compatible dependencies
        run: |
          python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          python -m pip install -r requirements.txt -c requirements.lock
          python -m pip check
      - name: Run all backend regression tests
        run: python -m unittest discover -s tests -v
